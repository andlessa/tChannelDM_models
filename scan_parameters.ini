[options]
cleanOutput = True
runMadGraph = True
runPythia = False
runDelphes = False
ncpu = 1
ncore = 1
[AuxPars]
mLLP = $loop{[100.,200.,400.,600.,800.,1000.,1200.,1400.,1500.]}
yDM = $loop{[1e-07]}
#xmDM = $loop{[0.01,0.1,0.3,0.5,0.8,0.85,0.9]}
[DelphesPars]
delphesDir = DelphesLLP
delphescard = Cards/delphes_card_HeHe.dat
[MadGraphPars]
#MG5 Cards:
proccard = Cards/proc_card_mg5_pp2HeHe.dat # Optional (only used if processFolder does not exist)
paramcard = Cards/param_card_HeHe.dat # Path to the default parameter_card.dat to be used by MadGraph. Note that the parameter values defined in the MadGraphSet section below will automatically overwrite the values in paramcard. If not defined, the default file for the model will be used.
runcard = Cards/run_card.dat # Path to the default run_card.dat to be used by MadGraph. Note that the parameter values defined in the MadGraphSet section below will automatically overwrite the values in runcard. If not defined, the default file for the model will be used.
#pythia8card = Cards/pythia8_card.dat
#delphescard = Cards/delphes_card_HeHe.dat
processFolder = pp2YeYe
[MadGraphSet]
iseed = ${MadGraphPars:runNumber}
nevents = 500
mhe = ${AuxPars:mLLP}
#ms0 = ${AuxPars:xmDM}*${AuxPars:mLLP}
ms0 = 0.1
#wHe = 6.582119569e-16/(${AuxPars:tauns})
yheer = ${AuxPars:yDM}
yhemur = ${AuxPars:yDM}
yhetar = ${AuxPars:yDM}
xqcut = max([25.0,${AuxPars:mLLP}/4.0])
time_of_flight = 0.001
run_tag = "mHe_%1.0fGeV_ms_%1.1fGeV_y_%1.1e" %(${mhe},${ms0},${yheer})
