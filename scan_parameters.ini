[options]
cleanOutput = True
runMadGraph = True
runPythia = False
runDelphes = False
runFO = True
ncpu = 1
ncore = 1
[AuxPars]
mLLP = $loop{[100.,200.,400.,600.,800.,1000.,1200.,1400.,1500.]}
yDM = 0.0 # Just to make sure there are no loop contributions from DM
#xmDM = $loop{[0.01,0.1,0.3,0.5,0.8,0.85,0.9]}
[DelphesPars]
delphesDir = DelphesLLP
delphescard = Cards/delphes_card_HeHe.dat
[MadGraphPars]
#MG5 Cards:
proccard = Cards/proc_card_scalarU_xsection.dat # Optional (only used if processFolder does not exist)
paramcard = Cards/param_card_scalar_quarks.dat # Path to the default parameter_card.dat to be used by MadGraph. Note that the parameter values defined in the MadGraphSet section below will automatically overwrite the values in paramcard. If not defined, the default file for the model will be used.
runcard = Cards/run_card_NLO.dat # Path to the default run_card.dat to be used by MadGraph. Note that the parameter values defined in the MadGraphSet section below will automatically overwrite the values in runcard. If not defined, the default file for the model will be used.
#pythia8card = Cards/pythia8_card.dat
#delphescard = Cards/delphes_card_HeHe.dat
processFolder = ./pp2ysu_NLO_xsections
[MadGraphSet]
iseed = ${MadGraphPars:runNumber}
myu = ${AuxPars:mLLP}
wyu = 0.0
yfqr = ${AuxPars:yDM}
yfbr = ${AuxPars:yDM}
yftr = ${AuxPars:yDM}
run_tag = "mSU_%1.0fGeV" %(${myu})
